<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Combinations Finder</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="test.js"></script>

</head>
<body>

<h2>Ngau Calculator</h2>

<div id="modeSelection" class="mode-selection">
    <p>Select Mode:</p>
    <div class="mode-buttons">
        <button onclick="modeSetting(5)">5 Card Mode</button>
        <button onclick="modeSetting(6)">6 Card Mode</button>
    </div>
</div>

<div id="mainCalc" class="calc hidden">
    <button class="back-btn" onclick="showModeModel()">Back</button>

    <label>Select Numbers:</label>
    <div id="selectedNumbers" class="output"></div>

    <div class="calc_button">
        <!-- Row 1 -->
        <button onclick="addNumber(1)">1</button>
        <button onclick="addNumber(2)">2</button>
        <button onclick="addNumber(3)">3</button>

        <!-- Row 2 -->
        <button onclick="addNumber(4)">4</button>
        <button onclick="addNumber(5)">5</button>
        <button onclick="addNumber(6)">6</button>

        <!-- Row 3 -->
        <button onclick="addNumber(7)">7</button>
        <button onclick="addNumber(8)">8</button>
        <button onclick="addNumber(9)">9</button>

        <!-- Row 4 -->
        <button onclick="addNumber(10)">10</button>
        <button onclick="addNumber(20)">J</button>
        <button onclick="addNumber(30)">Q</button>

        <!-- Row 5 -->
        <button onclick="addNumber(40)">K</button>
        <button onclick="addNumber(11)">♠</button>
        <button onclick="openDonationModal()">Donate</button>


        <!-- Row 6 -->
        <button class="calc-btn" onclick="updateSelectedNumbers()">Calculate</button>
        <button class="clear-btn" onclick="clearNumbers()">Clear</button>
    </div>


    <div class="results hidden">
        <h3>Results</h3>
        <div id="variantsOutput"></div>
    </div>
</div>

<!-- CNY Result Modal -->
<div id="resultModal" class="modal hidden">
  <div class="modal-content">
    <h2>🧧 Result 🧧</h2>
    <p id="modalMessage"></p>
    <button class="modal-close" onclick="closeModal()">OK</button>
  </div>
</div>

<!-- Donation Modal -->
<div id="donationModal" class="modal hidden">
  <div class="modal-content">
    <h2>🧧 Donation 🧧</h2>
    <img src="assets/tng-qr-code.png" alt="Donation QR Code">
    <button class="modal-close" onclick="closeDonationModal()">OK</button>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

</body>
</html>
